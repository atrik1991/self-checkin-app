<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>じぶんチェックイン</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#ffffff" />
<style>
  :root {
    --bg: #f7f8fc;
    --card: #ffffff;
    --text: #22223b;
    --muted: #8e8ea8;
    --line: #ecedf5;
    --accent: #6c5ce7;
    --accent-soft: #f0edff;
    --coral: #ff6b6b;
    --mint: #00b894;
    --amber: #fdcb6e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 16px calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding-top: calc(28px + env(safe-area-inset-top)); }

  header { margin-bottom: 20px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0; }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 22px 20px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(34, 34, 59, 0.04);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-bottom: 12px;
  }

  #question-text {
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.55;
    margin-bottom: 18px;
    letter-spacing: -0.01em;
  }

  /* ---- 自由記述 ---- */
  textarea {
    width: 100%;
    min-height: 110px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: #fafbff;
    color: var(--text);
    padding: 13px;
    font-size: 1rem;
    resize: vertical;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); background: #fff; }

  /* ---- 選択式 ---- */
  .choices { display: flex; flex-wrap: wrap; gap: 9px; }
  .choice-btn {
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--text);
    border-radius: 999px;
    padding: 11px 17px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .choice-btn:active { transform: scale(0.96); }
  .choice-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(108, 92, 231, 0.28);
  }
  .multi-hint {
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 600;
  }

  /* ---- 5段階 ---- */
  .scale-row { display: flex; justify-content: space-between; gap: 8px; }
  .scale-btn {
    flex: 1;
    aspect-ratio: 1;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 16px;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .scale-btn:active { transform: scale(0.94); }
  .scale-btn.selected {
    background: linear-gradient(135deg, #6c5ce7, #8b7bff);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 5px 14px rgba(108, 92, 231, 0.3);
    transform: translateY(-2px);
  }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
  }

  /* ---- ボタン ---- */
  button { font-family: inherit; }
  #submit-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 1rem;
    font-weight: 700;
    width: 100%;
    margin-top: 16px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 14px rgba(108, 92, 231, 0.25);
  }
  #submit-btn:active { transform: scale(0.98); }
  #submit-btn:disabled {
    background: #d8d9e8;
    box-shadow: none;
    cursor: default;
  }
  #shuffle-btn {
    display: block;
    margin: 12px auto 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    padding: 6px;
  }

  /* ---- 通知 ---- */
  #install-banner {
    display: none;
    background: #fff8e8;
    border: 1.5px solid #ffe4a8;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 0.85rem;
    line-height: 1.65;
    margin-bottom: 14px;
    color: #8a6d1f;
  }
  .notif-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #sub-status { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  #subscribe-btn {
    background: var(--accent-soft);
    border: none;
    color: var(--accent);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ---- 履歴 ---- */
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 28px 0 12px;
    gap: 12px;
  }
  h2 { font-size: 1rem; margin: 0; }
  #day-select {
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  #day-select:focus { outline: none; border-color: var(--accent); }

  #history-list { list-style: none; margin: 0; padding: 0; }
  #history-list li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .h-time { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
  .h-q { font-size: 0.85rem; color: var(--accent); font-weight: 700; margin-bottom: 6px; line-height: 1.5; }
  .h-a { font-size: 0.97rem; white-space: pre-wrap; line-height: 1.6; }
  .h-scale {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }
  .h-bar { display: flex; gap: 3px; }
  .h-dot { width: 20px; height: 6px; border-radius: 3px; background: var(--line); }
  .h-dot.on { background: var(--accent); }
  .h-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .h-chip {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 0.9rem;
    font-weight: 700;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    font-size: 0.9rem;
    padding: 28px 0;
    background: none;
    border: 1.5px dashed var(--line) !important;
  }

  /* ---- タブ ---- */
  .tabs {
    display: flex;
    gap: 6px;
    background: #eeeff7;
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 18px;
  }
  .tab {
    flex: 1;
    border: none;
    background: none;
    color: var(--muted);
    border-radius: 999px;
    padding: 10px 8px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab.is-active {
    background: #fff;
    color: var(--accent);
    box-shadow: 0 2px 8px rgba(34, 34, 59, 0.08);
  }

  /* ---- レポート生成 ---- */
  .gen-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
  .gen-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin: 0 0 14px; }
  .gen-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .gen-row select {
    flex: 1;
    min-width: 0;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--text);
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .gen-row select:focus { outline: none; border-color: var(--accent); }
  #generate-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(108, 92, 231, 0.25);
    transition: all 0.15s;
  }
  #generate-btn:active { transform: scale(0.98); }
  #generate-btn:disabled { background: #d8d9e8; box-shadow: none; cursor: default; }
  #gen-status {
    font-size: 0.82rem;
    line-height: 1.6;
    margin-top: 10px;
    font-weight: 600;
    color: var(--muted);
  }
  #gen-status.is-error { color: var(--coral); }
  #gen-status.is-done { color: var(--mint); }
  #gen-status:empty { display: none; }

  .section-h { font-size: 1rem; margin: 28px 0 12px; }

  /* ---- レポート一覧(アコーディオン) ---- */
  .rep-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .rep-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: none;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  .rep-when { font-size: 0.9rem; font-weight: 700; color: var(--text); }
  .rep-sub { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-left: auto; }
  .rep-caret { font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; }
  .rep-item.is-open .rep-caret { transform: rotate(180deg); }
  .rep-body { padding: 0 16px 18px; }
  .rep-body[hidden] { display: none; }
  .r-h {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--accent);
    margin: 22px 0 8px;
    letter-spacing: -0.01em;
  }
  .r-h:first-child { margin-top: 0; }
  .r-p { font-size: 0.95rem; line-height: 1.85; margin: 0 0 12px; }
  .r-ul { margin: 0 0 12px; padding-left: 1.1em; }
  .r-ul li { font-size: 0.95rem; line-height: 1.8; margin-bottom: 6px; }
  .rep-body strong { color: var(--text); font-weight: 700; }
  .report-empty {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.8;
    text-align: center;
    padding: 20px 0;
  }

  #toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    box-shadow: 0 6px 20px rgba(34, 34, 59, 0.2);
    z-index: 10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>じぶんチェックイン ✳︎</h1>
      <p class="sub">ふと届く質問に、思いついたまま答えるだけ</p>
    </header>

    <nav class="tabs">
      <button class="tab is-active" data-view="checkin" type="button">チェックイン</button>
      <button class="tab" data-view="report" type="button">じぶんレポート</button>
    </nav>

    <section id="view-checkin">
    <div id="install-banner">
      📲 通知を受け取るには、Safari の共有ボタンから「ホーム画面に追加」して、そのアイコンから開いてください。
    </div>

    <div class="card">
      <div class="badge" id="question-badge">—</div>
      <div id="question-text">読み込み中...</div>
      <div id="input-area"></div>
      <button id="submit-btn">記録する</button>
      <button id="shuffle-btn">↻ 別の質問にする</button>
    </div>

    <div class="card notif-card">
      <div id="sub-status">通知の状態を確認中...</div>
      <button id="subscribe-btn">通知をON</button>
    </div>

    <div class="history-head">
      <h2>これまでの記録</h2>
      <select id="day-select"></select>
    </div>
    <ul id="history-list"></ul>
    </section>

    <section id="view-report" hidden>
      <div class="card gen-card">
        <div class="gen-title">レポートを作る</div>
        <p class="gen-desc">これまでの記録を読み返して、いまの自分をまとめます。</p>
        <div class="gen-row">
          <select id="gen-days">
            <option value="30">直近30日</option>
            <option value="90">直近90日</option>
            <option value="365">全期間</option>
          </select>
          <select id="gen-model">
            <option value="claude-opus-5">じっくり</option>
            <option value="claude-sonnet-5">標準</option>
            <option value="claude-haiku-4-5">軽め</option>
          </select>
        </div>
        <button id="generate-btn" type="button">レポートを作る</button>
        <div id="gen-status"></div>
      </div>

      <h2 class="section-h">直近のレポート生成内容</h2>
      <div id="report-list"></div>
    </section>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
